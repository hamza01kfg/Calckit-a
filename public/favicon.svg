<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12181a"/>
      <stop offset="100%" stop-color="#0a0e0c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34e0a1"/>
      <stop offset="100%" stop-color="#12b886"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#1f2a26" stroke-width="2"/>

  <!-- sigma glyph, hand-drawn as path for crisp scaling -->
  <path d="M 168 158
           L 344 158
           L 344 200
           L 226 200
           L 306 256
           L 226 312
           L 344 312
           L 344 354
           L 168 354
           L 168 320
           L 262 256
           L 168 192
           Z"
        fill="url(#accent)"/>

  <!-- small calculator-dot accent, top right of glyph -->
  <circle cx="352" cy="176" r="14" fill="url(#accent)" opacity="0.55"/>
</svg>
